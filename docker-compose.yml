services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ordenes
      POSTGRES_PASSWORD: ordenes
      POSTGRES_DB: ordenes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordenes -d ordenes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
